name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs the whole CI on the commit it releases when it finds no green CI run of that commit on
  # main to reuse (scripts/ci-result.sh). A called run sees the caller's event (workflow_dispatch), so it runs the
  # full sweep, and the caller's run id, so it gets a concurrency group of its own.
  workflow_call:
  schedule:
    # Weekly full sweep that ignores path filters.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  # Pull request runs share a group per pull request, and a new push cancels the superseded run. Every other run
  # (main, manual, weekly, called by a release) has a group of its own, so none is ever cancelled or dropped while
  # it waits.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          # The same documentation-only paths as scripts/verify.sh --changed.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!LICENSE'

  # Always runs: documentation is where Hebrew text, addresses and private names slip in.
  guards:
    name: Guards
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify.sh --guards-only

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify changed areas
        if: github.event_name == 'pull_request'
        run: scripts/verify.sh --changed "origin/${{ github.base_ref }}"
      - name: Verify everything
        if: github.event_name != 'pull_request'
        run: scripts/verify.sh

  summary:
    name: CI summary
    if: always()
    needs: [changes, guards, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done
