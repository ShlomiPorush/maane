# Maane's clamd configuration, mounted read-only at /etc/clamav/clamd.conf in the clamav service. The image's
# /init-unprivileged entrypoint runs clamd as clamav (UID 100) and does not apply CLAMD_CONF_* variables, so every
# setting Maane relies on is written here. No secret belongs in this file. Reference: clamd.conf(5).

# The entrypoint starts clamd in the foreground and waits for this socket before it reports clamd as started.
Foreground yes
LocalSocket /tmp/clamd.sock
# The server and the worker scan through INSTREAM over TCP; the image's health check sends PING to this port.
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
# No LogFile: clamd writes to stdout, like every other service of the stack.
LogTime yes

# Maane treats these alerts as "not fully scanned": never clean, never previewed (docs/requirements.md, 3.3). The
# worker's self-test proves the encrypted alerts with samples; AlertExceedsMax cannot be proven by a sample, so it is
# a documented requirement for an outside clamd.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes

# Scan limits, explicit so they do not move with a new ClamAV release. StreamMaxLength must stay at or above the
# largest value the files.maxBytes setting accepts (100 MB): a longer stream is refused, not scanned.
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000
MaxScanTime 120000
