# Maane's freshclam configuration, mounted read-only at /etc/clamav/freshclam.conf in the clamav service. freshclam
# runs as clamav (UID 100) and keeps the signatures in the bind-mounted /var/lib/clamav, so a restart does not download
# them again. No secret belongs in this file. Reference: freshclam.conf(5).

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
# Tells clamd to load new signatures after an update.
NotifyClamd /etc/clamav/clamd.conf
# No UpdateLogFile: freshclam writes to stdout.
LogTime yes
