# Development stack. Copy to the repository root as docker-compose-dev.yml (ignored by git) and use it only through
# scripts/local.sh. scripts/verify.sh uses this tracked file directly. Relative paths resolve against the repository
# root (the scripts pass --project-directory). Images are built by the scripts; nothing is built here.
#
# The database password and the keys are generated on this machine into <data dir>/postgres.env and
# <data dir>/app.env (mode 600) by the scripts; the repository holds none. The scripts also create <data dir>/data
# (attachments, owned by UID 1000) and <data dir>/clamav (ClamAV's signatures, owned by UID 100). MAANE_PORT and
# MAANE_PUBLIC_URL may be set in the shell; scripts/verify.sh sets its own.

services:
  server:
    image: maane:${MAANE_IMAGE_TAG:-dev}
    env_file:
      - path: ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/app.env
    environment:
      MAANE_PUBLIC_URL: ${MAANE_PUBLIC_URL:-http://127.0.0.1:${MAANE_PORT:-8095}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAANE_PORT:-8095}:8080"
    volumes:
      - ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/data:/data
    networks:
      - default
      - scanner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    image: maane:${MAANE_IMAGE_TAG:-dev}
    command: ["node", "dist/worker/index.js"]
    env_file:
      - path: ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/app.env
    environment:
      MAANE_PUBLIC_URL: ${MAANE_PUBLIC_URL:-http://127.0.0.1:${MAANE_PORT:-8095}}
    # The server runs the migrations; the worker starts once the server is healthy.
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/data:/data
    networks:
      - default
      - scanner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "dist/worker/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgres:18.6-bookworm
    env_file:
      - path: ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/postgres.env
    volumes:
      # PostgreSQL 18 keeps its data in a versioned directory under /var/lib/postgresql.
      - ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # The virus scanner, as in docker-compose.yml: clamav (UID 100) through the image's unprivileged entrypoint, with
  # Maane's own configuration, reachable only on the scanner network.
  clamav:
    image: clamav/clamav:1.5.4
    user: "100:101"
    entrypoint: ["/init-unprivileged"]
    volumes:
      - ${MAANE_DATA_DIR:?MAANE_DATA_DIR is set by the scripts}/clamav:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./docker/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    networks:
      - scanner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      start_interval: 5s
      retries: 3

networks:
  # ClamAV and the two services that scan. Not internal: freshclam downloads signatures.
  scanner: {}
