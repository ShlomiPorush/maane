# Production deployment. Runs the image the release workflow publishes to GHCR and ClamAV's published image; nothing is
# built here. Behind Traefik on the external "traefik" network, so no port is published. Three files sit next to this
# one, as docs/deployment.md describes; none is ever committed:
#   .env          VERSION, DOMAIN, LINK_DOMAIN, and GEOIP_DIR, the only values Compose interpolates; none is a secret
#                 (contract: .env.example).
#   postgres.env  PostgreSQL's own variables, read only by postgres (contract: docker/env/postgres.env.example).
#   app.env       the server's and the worker's secrets and overrides (contract: docker/env/app.env.example).
# The secrets reach the containers only through env_file, so `docker compose config --no-env-resolution` shows none.
# Beside them: ./data (attachments, owned by UID 1000), ./clamav (ClamAV's signatures, owned by UID 100), and
# ClamAV's configuration in ./docker/clamav/, which holds no secret.
name: maane

x-app: &app
  image: ghcr.io/shlomiporush/maane:${VERSION:?Set VERSION in .env to the release to run}
  env_file:
    - path: app.env
  environment:
    MAANE_PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
  # Runs as node (set in the image) with no capability and no way to gain privileges, on a read-only root.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  # Attachments and inline images, stored by hash under /data/files; the server and the worker share it.
  volumes:
    - ./data:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  server:
    <<: *app
    environment:
      MAANE_PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # The GeoLite2 City and ASN files that locate a click (plan 3.4), read only; each file is optional.
      MAANE_GEOIP_DIR: /geoip
    volumes:
      - ./data:/data
      # Your updater's folder of GeoLite2-City.mmdb and GeoLite2-ASN.mmdb (GEOIP_DIR in .env), never written by Maane.
      - ${GEOIP_DIR:-./geoip}:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik
      - internal
      - scanner
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.maane.loadbalancer.server.port=8080"
      - "traefik.http.routers.maane.entrypoints=https"
      - "traefik.http.routers.maane.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.maane.tls=true"
      - "traefik.http.routers.maane.service=maane"
      - "traefik.http.routers.maane.middlewares=default@file"
      # Tracked links and download links on the link domain (LINK_DOMAIN in .env, by default DOMAIN): only /l/ and /f/.
      - "traefik.http.routers.maane-links.entrypoints=https"
      - "traefik.http.routers.maane-links.rule=Host(`${LINK_DOMAIN:-${DOMAIN}}`) && (PathPrefix(`/l/`) || PathPrefix(`/f/`))"
      - "traefik.http.routers.maane-links.tls=true"
      - "traefik.http.routers.maane-links.service=maane"
      - "traefik.http.routers.maane-links.middlewares=default@file"
    healthcheck:
      test: ["CMD", "node", "dist/server/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: ["node", "dist/worker/index.js"]
    # The server runs the migrations; the worker starts once the server is healthy.
    depends_on:
      server:
        condition: service_healthy
    networks:
      - internal
      - scanner
    healthcheck:
      test: ["CMD", "node", "dist/worker/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgres:18.6-bookworm
    # Only its own file: the application's secrets never reach PostgreSQL.
    env_file:
      - path: postgres.env
    volumes:
      - ./postgres-data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # The virus scanner. clamd answers INSTREAM on port 3310 to the server and the worker only; freshclam keeps the
  # signatures in ./clamav up to date. Runs as clamav (UID 100) through the image's own unprivileged entrypoint, which
  # starts both without root; that entrypoint ignores CLAMD_CONF_* variables, so Maane mounts its own configuration.
  clamav:
    image: clamav/clamav:1.5.4
    user: "100:101"
    entrypoint: ["/init-unprivileged"]
    environment:
      # Signature checks per day (the entrypoint passes it to freshclam --checks).
      FRESHCLAM_CHECKS: "12"
    volumes:
      - ./clamav:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./docker/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # clamd's socket, its scan files, and the entrypoint's first-download configuration. Logs go to stdout.
    tmpfs:
      - /tmp
    networks:
      - scanner
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # The image's own check: clamd answers PING on port 3310. The first start downloads the signatures first.
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      start_interval: 5s
      retries: 3

networks:
  traefik:
    external: true
  # PostgreSQL has no route outside the stack.
  internal:
    internal: true
  # ClamAV and the two services that scan. Not internal: freshclam downloads signatures, and the worker reaches
  # outside services (Microsoft Graph from phase 2.3).
  scanner: {}
